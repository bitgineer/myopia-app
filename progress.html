<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myopia App - Progress History</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Add specific styles for the progress table */
        #progress-table {
            width: 100%;
            margin-top: 1rem;
            border-collapse: collapse;
        }
        #progress-table th, #progress-table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        #progress-table th {
            background-color: #f2f2f2;
        }
        #no-history {
            font-style: italic;
            color: #666;
        }
    </style>
</head>
<body>
    <header>
        <h1>Progress History</h1>
        <nav>
            <a href="index.html">Exercise</a> | 
            <a href="progress.html">Progress</a>
        </nav>
    </header>

    <main>
        <h2>Your Past Sessions</h2>
        <div id="history-container">
            <!-- Progress history will be loaded here -->
            <p id="no-history">No history recorded yet.</p>
            <table id="progress-table" style="display: none;">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Duration (seconds)</th>
                        <th>Speed Setting</th>
                        <th>Pattern</th>
                    </tr>
                </thead>
                <tbody id="progress-body">
                    <!-- Data rows will be inserted here -->
                </tbody>
            </table>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Myopia App</p>
    </footer>

    <!-- Include the tracking script to access getHistory -->
    <script src="js/tracking.js"></script> 
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const history = window.myopiaTracker.getHistory();
            const tableBody = document.getElementById('progress-body');
            const noHistoryMsg = document.getElementById('no-history');
            const progressTable = document.getElementById('progress-table');

            if (history.length > 0) {
                noHistoryMsg.style.display = 'none';
                progressTable.style.display = 'table'; // Show the table

                // Sort history newest first
                history.sort((a, b) => b.startTime - a.startTime); 

                history.forEach(session => {
                    const row = tableBody.insertRow();
                    const date = new Date(session.startTime);
                    
                    const cellDate = row.insertCell();
                    cellDate.textContent = date.toLocaleDateString();

                    const cellTime = row.insertCell();
                    cellTime.textContent = date.toLocaleTimeString();

                    const cellDuration = row.insertCell();
                    // Display duration in seconds, calculated from durationMs
                    cellDuration.textContent = Math.round(session.durationMs / 1000);

                    const cellSpeed = row.insertCell();
                    // Map speed value back to text label
                    let speedLabel = 'Unknown';
                    if (session.speed === 1) speedLabel = 'Slow';
                    else if (session.speed === 2) speedLabel = 'Medium';
                    else if (session.speed === 4) speedLabel = 'Fast';
                    cellSpeed.textContent = speedLabel + ` (${session.speed})`;

                    const cellPattern = row.insertCell();
                    // Display pattern - maybe map to nicer names later if needed
                    cellPattern.textContent = session.pattern || 'N/A'; // Handle older data without pattern
                });
            } else {
                noHistoryMsg.style.display = 'block';
                progressTable.style.display = 'none';
            }
        });
    </script>
</body>
</html>
